name: Fetch Lingua Libre audio

# Manual run: downloads the human Tajik recordings listed in content/audio-sources/lingualibre-tg.json,
# converts them, refreshes the audio manifest and commits the result to main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: ffmpeg (static build from PyPI; apt is slow on runners)
        run: |
          pip install --quiet imageio-ffmpeg
          echo "FFMPEG=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - run: python3 scripts/audio/fetch_lingualibre.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm audio:list
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/audio content/audio-manifest.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Use Lingua Libre human recordings for Tajik words"
          git push
